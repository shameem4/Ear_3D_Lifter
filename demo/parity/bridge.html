<!doctype html><meta charset="utf-8"><title>Render bridge</title>
<script type="module">
import { PipelineRenderer } from "../js/renderer.js";
const shading = await (await fetch("../js/shading.json")).json();
const r = new PipelineRenderer(shading, 600);
const have = {};
const blob = async (k, T) => new T(await (await fetch(`/blob/${k}`)).arrayBuffer());
for (;;) {
  const j = await (await fetch("/next")).json();
  if (j.stop) break;
  if (have[`m${j.mesh}`] !== j.meshKey) {
    const ver = j.meshKey.split("_")[1];
    r.setMesh(j.mesh, await blob(`m${j.mesh}_V_${ver}`, Float64Array), await blob(`m${j.mesh}_F_${ver}`, Uint32Array));
    have[`m${j.mesh}`] = j.meshKey;
    for (const k of Object.keys(have)) if (k.startsWith("c")) have[k] = null;
  }
  if (have[`c${j.colors}`] !== j.colorKey) { r.setColors(j.colors, j.colorMesh, await blob(j.colorKey, Float64Array)); have[`c${j.colors}`] = j.colorKey; }
  for (let i = 0; i < j.views.length; i++) {
    const { rgba, depth } = r.render(j.mesh, j.colors, j.views[i], j.f, j.c, j.depth);
    const body = depth ? new Blob([rgba, depth]) : new Blob([rgba]);
    await fetch(`/result?seq=${j.seq}&i=${i}`, { method: "POST", body });
  }
}
</script>
